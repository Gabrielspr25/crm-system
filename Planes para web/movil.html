<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claro Business — Planes Móviles PYMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);
  min-height:100vh;color:#e2e8f0;
}
.header{
  background:rgba(220,38,38,0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding:14px 24px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:100;
}
.brand-logo{font-size:24px;font-weight:900;letter-spacing:-1px;color:#fff}
.brand-text{flex:1}
.brand-title{font-size:15px;font-weight:700;color:#fff}
.brand-sub{color:rgba(255,255,255,0.8);font-size:12px;margin-top:1px}
.header-search{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;padding:8px 14px;
}
.header-search input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:200px}
.header-search input::placeholder{color:rgba(255,255,255,0.6)}

.nav{
  background:rgba(15,23,42,0.7);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:0 24px;display:flex;gap:4px;overflow-x:auto;
}
.nav a{
  color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;
  padding:11px 14px;border-bottom:2px solid transparent;
  text-decoration:none;white-space:nowrap;transition:color .2s,border-color .2s;
}
.nav a:hover{color:#fff}
.nav a.active{color:#38bdf8;border-bottom-color:#38bdf8}

/* Toggle autopay */
.autopay-bar{
  background:rgba(15,23,42,0.6);
  padding:12px 24px;
  display:flex;align-items:center;gap:14px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle-switch{
  width:40px;height:22px;border-radius:11px;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.2);
  position:relative;transition:background .2s;cursor:pointer;
}
.toggle-switch.on{background:rgba(74,222,128,0.4);border-color:rgba(74,222,128,0.6)}
.toggle-knob{
  width:16px;height:16px;border-radius:50%;
  background:#fff;position:absolute;top:2px;left:2px;
  transition:left .2s;
}
.toggle-switch.on .toggle-knob{left:20px}
.toggle-label{font-size:13px;color:rgba(255,255,255,0.7)}
.toggle-label b{color:#4ade80}
.autopay-hint{font-size:12px;color:rgba(255,255,255,0.35);margin-left:auto}

.container{max-width:1100px;margin:0 auto;padding:24px}

/* Plan card */
.plan-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;margin-bottom:24px;overflow:hidden;
}
.plan-card:hover{border-color:rgba(255,255,255,0.14)}

.plan-card-header{
  padding:20px 24px 16px;
  display:flex;align-items:flex-start;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.07);
}
.plan-name{font-size:20px;font-weight:800;color:#f1f5f9;margin-bottom:4px}
.plan-sub{font-size:13px;color:#38bdf8;font-weight:500}
.plan-desc{font-size:12px;color:rgba(255,255,255,0.45);margin-top:4px}

.plan-badges{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;
}
.badge-green{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3)}
.badge-blue{background:rgba(56,189,248,0.15);color:#38bdf8;border:1px solid rgba(56,189,248,0.3)}
.badge-purple{background:rgba(167,139,250,0.15);color:#a78bfa;border:1px solid rgba(167,139,250,0.3)}
.badge-amber{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}
.badge-red{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.3)}

/* Lineas table */
.lineas-table{width:100%;border-collapse:collapse;font-size:13px}
.lineas-table th{
  text-align:left;padding:10px 16px;
  color:rgba(255,255,255,0.5);font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;
  background:rgba(0,0,0,0.15);
}
.lineas-table td{
  padding:11px 16px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  vertical-align:middle;
}
.lineas-table tr:last-child td{border-bottom:none}
.lineas-table tr:hover td{background:rgba(255,255,255,0.03)}

.linea-num{font-weight:700;color:rgba(255,255,255,0.5);font-size:12px}
.linea-codigo{font-family:monospace;font-size:11px;background:rgba(56,189,248,0.1);color:#7dd3fc;padding:2px 7px;border-radius:4px}
.linea-precio{font-weight:700;font-size:15px;color:#fff}
.linea-total{font-weight:700;color:#4ade80}
.linea-total-ap{font-weight:700;color:#22d3ee}
.linea-savings{font-size:11px;color:rgba(74,222,128,0.7)}

/* Coverage chips */
.coverage-section{padding:14px 24px;background:rgba(0,0,0,0.1)}
.coverage-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,0.4);margin-bottom:8px}
.coverage-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:3px 10px;color:rgba(255,255,255,0.6)}

.plan-footer{padding:10px 24px;background:rgba(0,0,0,0.08);font-size:11px;color:rgba(255,255,255,0.35)}

/* Summary row */
.summary-section{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;
  margin-bottom:24px;
}
.summary-card{
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:16px 20px;
}
.summary-plan{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.summary-l1{font-size:22px;font-weight:800;color:#38bdf8}
.summary-range{font-size:12px;color:rgba(255,255,255,0.4)}

.state-card{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.4)}
.state-icon{font-size:48px;margin-bottom:12px}
.state-title{font-size:16px;font-weight:600;margin-bottom:6px;color:rgba(255,255,255,0.6)}

@media(max-width:640px){
  .header{flex-wrap:wrap}
  .header-search{width:100%}
  .header-search input{width:100%}
  .container{padding:12px}
  .plan-card-header{flex-direction:column;gap:12px}
  .lineas-table{font-size:12px}
  .lineas-table th,.lineas-table td{padding:8px 10px}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand-logo">CLARO</div>
  <div class="brand-text">
    <div class="brand-title">Planes Móviles — Estructura de Negocios</div>
    <div class="brand-sub">PYMES / Corporativo · Business Red</div>
  </div>
  <div class="header-search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:rgba(255,255,255,0.7);flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar plan, código...">
  </div>
</header>

<nav class="nav">
  <a href="index.html">📞 Planes Fijos</a>
  <a href="movil.html" class="active">📱 Planes Móviles</a>
  <a href="banda-ancha.html">📡 Inalámbrico / IoT</a>
  <a href="equipos.html">📋 Lista de Equipos</a>
</nav>

<div class="autopay-bar">
  <span class="toggle-label">AutoPay:</span>
  <div class="toggle-wrap" onclick="toggleAutopay()">
    <div class="toggle-switch" id="autopaySwitch"><div class="toggle-knob"></div></div>
    <span class="toggle-label" id="autopayLabel">Sin AutoPay</span>
  </div>
  <span class="autopay-hint">AutoPay = -$10 por línea / mes</span>
</div>

<div class="container" id="mainContainer">
  <div class="state-card">
    <div class="state-icon">⏳</div>
    <div class="state-title">Cargando planes...</div>
  </div>
</div>

<script>
const API_BASE = '';
let allModulos = [];
let autopayOn = false;

async function loadPlanes() {
  try {
    const r = await fetch(`${API_BASE}/api/planes-modulos/moviles`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    allModulos = data.modulos || [];
    render();
  } catch(e) {
    document.getElementById('mainContainer').innerHTML = `
      <div class="state-card">
        <div class="state-icon">⚠️</div>
        <div class="state-title">Error al cargar</div>
        <div class="state-sub">${e.message}</div>
      </div>`;
  }
}

function toggleAutopay() {
  autopayOn = !autopayOn;
  const sw = document.getElementById('autopaySwitch');
  const lbl = document.getElementById('autopayLabel');
  sw.classList.toggle('on', autopayOn);
  lbl.innerHTML = autopayOn ? '<b>Con AutoPay (-$10/línea)</b>' : 'Sin AutoPay';
  render();
}

function calcLineas(lineas, apDescuento, showAP) {
  let cum = 0;
  return lineas.map(l => {
    cum += l.precio;
    const precioAP = Math.max(0, l.precio - apDescuento);
    const cumAP = cum - (apDescuento * lineas.indexOf(l) ) - apDescuento;
    // Recalculate cumulative with AutoPay
    return { ...l, cumSin: cum, cumCon: null }; // Will recalculate below
  });
}

function buildCumulatives(lineas, apDesc) {
  let cumSin = 0, cumCon = 0;
  return lineas.map(l => {
    cumSin += l.precio;
    cumCon += Math.max(0, l.precio - apDesc);
    return { ...l, cumSin, cumCon };
  });
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('mainContainer');

  let visible = allModulos;
  if (q) {
    visible = allModulos.filter(m =>
      m.titulo.toLowerCase().includes(q) ||
      m.subtitulo?.toLowerCase().includes(q) ||
      (m.contenido?.lineas || []).some(l => l.codigo.toLowerCase().includes(q))
    );
  }

  container.innerHTML = '';

  if (!visible.length) {
    container.innerHTML = `<div class="state-card"><div class="state-icon">🔍</div>
      <div class="state-title">Sin resultados</div></div>`;
    return;
  }

  // Summary cards
  const summary = document.createElement('div');
  summary.className = 'summary-section';
  visible.forEach(m => {
    const lineas = m.contenido?.lineas || [];
    const apDesc = m.contenido?.autopay_descuento || 10;
    const lineasCalc = buildCumulatives(lineas, apDesc);
    const l1 = lineasCalc[0];
    const l10 = lineasCalc[lineasCalc.length - 1];
    const precio = autopayOn ? l1?.cumCon : l1?.cumSin;
    const max = autopayOn ? l10?.cumCon : l10?.cumSin;

    summary.innerHTML += `
      <div class="summary-card">
        <div class="summary-plan">${m.titulo}</div>
        <div class="summary-l1">$${precio?.toFixed(0)}/L1</div>
        <div class="summary-range">Hasta $${max?.toFixed(0)} (${lineas.length} líneas)</div>
      </div>`;
  });
  container.appendChild(summary);

  // Full plan cards
  visible.forEach(m => {
    const card = buildPlanCard(m);
    container.appendChild(card);
  });
}

function buildPlanCard(m) {
  const c = m.contenido || {};
  const lineas = c.lineas || [];
  const apDesc = c.autopay_descuento || 10;
  const calc = buildCumulatives(lineas, apDesc);

  const hotspot = c.hotspot || '';
  const disp = (c.disponible || []).join(' · ');
  const dispositivos = (c.dispositivos || []).join(', ');
  const cobertura = c.cobertura || [];
  const nota = c.nota || '';

  // Badge color based on plan name
  const nameL = m.titulo.toLowerCase();
  const cardAccent = nameL.includes('sin fronteras') ? '#a78bfa' :
                     nameL.includes('supreme') ? '#f59e0b' :
                     nameL.includes('extreme') ? '#f87171' : '#38bdf8';

  const card = document.createElement('div');
  card.className = 'plan-card';
  card.style.borderColor = `${cardAccent}30`;

  // Header
  const headerHTML = `
    <div class="plan-card-header">
      <div>
        <div class="plan-name" style="color:${cardAccent}">${m.titulo}</div>
        ${m.subtitulo ? `<div class="plan-sub">${m.subtitulo}</div>` : ''}
        ${m.descripcion ? `<div class="plan-desc">${m.descripcion}</div>` : ''}
      </div>
      <div class="plan-badges">
        ${hotspot ? `<span class="badge badge-blue">📶 ${hotspot}</span>` : ''}
        ${disp ? `<span class="badge badge-green">✓ ${disp}</span>` : ''}
        ${cobertura.length ? `<span class="badge badge-purple">🌎 ${cobertura.length} Países</span>` : ''}
        ${dispositivos ? `<span class="badge badge-amber">📱 ${dispositivos}</span>` : ''}
      </div>
    </div>`;

  // Table
  const apHeader = autopayOn
    ? `<th>Precio/Línea</th><th>Precio c/AutoPay</th><th>Total sin AP</th><th>Total con AP</th>`
    : `<th>Precio/Línea</th><th>Total sin AutoPay</th>`;

  const rows = calc.map(l => {
    const precioAP = Math.max(0, l.precio - apDesc);
    if (autopayOn) {
      return `<tr>
        <td><span class="linea-num">L${l.linea}</span></td>
        <td><span class="linea-codigo">${l.codigo}</span></td>
        <td><span class="linea-precio">$${l.precio}</span></td>
        <td><span class="linea-precio" style="color:#22d3ee">$${precioAP}</span></td>
        <td><span class="linea-total">$${l.cumSin.toFixed(0)}</span></td>
        <td><span class="linea-total-ap">$${l.cumCon.toFixed(0)}</span>
          <span class="linea-savings"> (-$${(l.cumSin-l.cumCon).toFixed(0)})</span></td>
      </tr>`;
    } else {
      return `<tr>
        <td><span class="linea-num">L${l.linea}</span></td>
        <td><span class="linea-codigo">${l.codigo}</span></td>
        <td><span class="linea-precio">$${l.precio}</span></td>
        <td><span class="linea-total">$${l.cumSin.toFixed(0)}</span></td>
      </tr>`;
    }
  }).join('');

  const tableHTML = `
    <table class="lineas-table">
      <thead><tr>
        <th>Línea</th><th>Código</th>
        ${apHeader}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  // Coverage
  const coverageHTML = cobertura.length ? `
    <div class="coverage-section">
      <div class="coverage-title">🌎 Cobertura</div>
      <div class="coverage-chips">
        ${cobertura.map(p => `<span class="chip">${p}</span>`).join('')}
      </div>
    </div>` : '';

  const footerHTML = nota ? `<div class="plan-footer">ℹ️ ${nota}</div>` : '';

  card.innerHTML = headerHTML + tableHTML + coverageHTML + footerHTML;
  return card;
}

document.getElementById('searchInput').addEventListener('input', () => render());

loadPlanes();
</script>
</body>
</html>
